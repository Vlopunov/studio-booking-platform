[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]
cmds = ["corepack enable", "corepack prepare pnpm@9.15.0 --activate"]

[phases.install]
cmds = ["cd /app && pnpm install"]

[phases.build]
cmds = ["cd /app/packages/database && npx prisma generate"]

[start]
cmd = "cd /app && pnpm --filter @studio/api dev"
